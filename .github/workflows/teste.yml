name: Executar Testes

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar Dependências
        run: dotnet restore ScreenSound.sln
        working-directory: ScreenSound

      - name: Executar Testes
        run: dotnet test ScreenSound.sln --logger "trx;LogFileName=resultado_teste.trx" --filter Categoria=Integração
        working-directory: ScreenSound

      - name: Salvar Relatório Testes
        uses: actions/upload-artifact@v4
        with:
          name: resultado-Testes
          path: resultado_teste.trx
      
      - name: Executar teste e gerar relatório de cobertura
        run: dotnet test ScreenSound.sln --collect:"XPlat Code Coverage" --filter Categoria=Integração
        working-directory: ScreenSound

      - name: Listar arquivos de cobertura
        run: ls ScreenSound.Tests.Integracao/TestResults/**/coverage.cobertura.xml
        working-directory: ScreenSound

      - name: Localizar arquivo de cobertura
        id: cobertura
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path "ScreenSound.Tests.Integracao/TestResults" -Recurse -Filter "coverage.cobertura.xml"
          echo "coverage_file=$($file.FullName)" >> $env:GITHUB_ENV
        working-directory: ScreenSound

      - name: Instalar ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Gerar relatório de cobertura
        run: |
          reportgenerator -reports:"${{ env.coverage_file }}" -targetdir:"ScreenSound.Tests.Integracao/RelatorioCobertura"
        working-directory: ScreenSound

      - name: Listar arquivos do relatório
        run: ls ScreenSound.Tests.Integracao/RelatorioCobertura
        working-directory: ScreenSound

      - name: Upload do artefato do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: ScreenSound/ScreenSound.Tests.Integracao/RelatorioCobertura